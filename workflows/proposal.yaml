input_type:
  task: "首次提案任务及必要背景的自然语言文本；任务也可来自最近对话。"
  revision: "已有提案的位置、修改要求及相关背景的自然语言文本，可说明需更新的章节。"
output_type:
  done: "最终交付的自然语言文本；首次为完整提案，后续修改为更新章节及简短说明。"
instructions:
  - skill:persona-mei
  - skill:proposal-content
  - skill:proposal-artifact
graph:
  nodes:
    draft:
      run: skill:proposal-draft
    review:
      use:
        input_type:
          draft: "自然语言草稿交接，说明任务、提案位置、交付范围与变更情况。"
          revision: "已有提案的位置、待落实的修改要求及相关背景；交付更新章节及简短说明。"
        output_type:
          done: "保留任务、提案位置、交付范围、待落实的修改要求及已有变更说明，并附过度设计审查结论、具体简化建议和理由的自然语言文本。"
        instructions: ^
        node:
          run: skill:proposal-review-complexity
      in:
        new:
          workspace: ^
          history: none
    simplify:
      run: skill:proposal-apply-simplifications
    publish:
      run: skill:proposal-delivery
  edges:
    - start.task -> draft
    - start.revision -> review.revision
    - draft -> review.draft
    - review.done -> simplify
    - simplify -> publish
    - publish -> end.done
